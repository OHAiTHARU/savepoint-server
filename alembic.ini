[alembic]
prepend_sys_path = .
path_separator = os
script_location = migrations
# Overridden at runtime from SAVEPOINT_DATA_DIR; used for `alembic revision --autogenerate`.
sqlalchemy.url = sqlite:///./dev-data/savepoint.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
