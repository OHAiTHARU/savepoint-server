<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#14161a">
  <title>{% block title %}Savepoint{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'>
  {% block nav %}
  <header class="topbar">
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm2 2v5h8V5H7Zm5 8a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>
      <span>Savepoint</span>
    </a>
    <nav class="nav">
      <a href="/" class="{{ 'active' if path == '/' or path.startswith('/games') or path.startswith('/versions') }}">Games</a>
      <a href="/machines" class="{{ 'active' if path.startswith('/machines') }}">Machines</a>
      <a href="/settings" class="{{ 'active' if path.startswith('/settings') }}">Settings</a>
      <form method="post" action="/logout" class="inline">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="link" type="submit" title="Sign out">Sign out</button>
      </form>
    </nav>
  </header>
  {% endblock %}
  <main class="container">
    <div id="flash-area">
      {% for f in flashes %}
      <div class="flash flash-{{ f.kind }}">{{ f.message }}</div>
      {% endfor %}
    </div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
